<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <title>User Registration Form</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 40px; background-color: #f4f6f9;">

    <div style="max-width: 400px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
        <h2 style="color: #333; margin-top: 0;">Enter Your Information</h2>
        
        <!-- Note the method="get" attribute -->
        <form action="/submit-form" method="get">
            <div style="margin-bottom: 15px;">
                <label for="username" style="display: block; margin-bottom: 5px; font-weight: bold;">Username:</label>
                <input type="text" id="username" name="username" required style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
            </div>
            
            <button type="submit" style="background-color: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 1rem;">Submit Form</button>
        </form>
    </div>

</body>
</html>
