<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <title>Form Submitted Successfully</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 40px; background-color: #f4f6f9;">

    <div style="max-width: 500px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
        <h2 style="color: #28a745; margin-top: 0;">Thank You!</h2>
        
        <!-- Welcome Message requested -->
        <p style="font-size: 1.2rem; color: #333;">
            Welcome <b th:text="${username}"></b>,
        </p>
        
        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
        
        <h4 style="color: #666; margin-bottom: 5px;">Raw Form Data Received:</h4>
        <div style="background-color: #f8f9fa; border-left: 4px solid #007bff; padding: 15px; font-family: monospace; word-break: break-all;">
            <span th:text="${fullData}"></span>
        </div>
        
        <br>
        <a href="/register" style="color: #007bff; text-decoration: none;">← Go back to form</a>
    </div>

</body>
</html>
