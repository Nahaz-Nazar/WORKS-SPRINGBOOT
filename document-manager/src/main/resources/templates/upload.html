<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Document Manager</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .message { color: green; font-weight: bold; margin-bottom: 15px; }
        .error { color: red; font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>
    <h2>Upload Document</h2>
    
    <!-- Display Confirmation or Error Message -->
    <div th:if="${message}">
        <p th:class="${#strings.contains(message, 'successfully')} ? 'message' : 'error'" th:text="${message}"></p>
    </div>

    <!-- Upload Form -->
    <form method="POST" action="/upload" enctype="multipart/form-data">
        <label for="fileSelect">Select a PDF or Image file:</label><br><br>
        <input type="file" id="fileSelect" name="file" accept=".pdf,image/*" required />
        <br/><br/>
        <button type="submit">Upload & Send Email</button>
    </form>
</body>
</html>
