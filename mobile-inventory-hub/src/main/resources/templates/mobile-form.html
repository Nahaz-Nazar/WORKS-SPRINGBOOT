<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <title>Mobile Shop Registry</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f6f9; }
        .box { max-width: 400px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 1rem; }
    </style>
</head>
<body>
    <div class="box">
        <h2>New Mobile Registration</h2>
        <form th:action="@{/mobile/save}" th:object="${mobile}" method="post">
            <div class="group">
                <label>Phone Name:</label>
                <input type="text" th:field="*{name}" required th:autocomplete="off" />
            </div>
            <div class="group">
                <label>Brand Manufacturer:</label>
                <input type="text" th:field="*{brand}" required th:autocomplete="off" />
            </div>
            <div class="group">
                <label>Retail Price (₹):</label>
                <input type="number" step="0.01" th:field="*{price}" required />
            </div>
            <div class="group">
                <label>Operating Platform Type:</label>
                <select th:field="*{type}">
                    <option value="Android">Android</option>
                    <option value="iPhone">iPhone</option>
                    <option value="Feature Phone">Feature Phone</option>
                </select>
            </div>
            <button type="submit">Commit to Registry</button>
        </form>
    </div>
</body>
</html>
