<!DOCTYPE html>
<html>
<head>
    <title>User Registration</title>
</head>
<body style="padding: 40px; font-family: Arial;">
    <h2>User Registration Form</h2>
    <form id="regForm">
        <input type="text" id="firstName" placeholder="First Name" required><br><br>
        <input type="text" id="lastName" placeholder="Last Name" required><br><br>
        <input type="text" id="mobile" placeholder="Mobile Number" required><br><br>
        <input type="email" id="email" placeholder="Email" required><br><br>
        <input type="password" id="password" placeholder="Password" required><br><br>
        <button type="submit">Register</button>
    </form>
    
    <h3 style="color: green;">Response from Server:</h3>
    <pre id="result" style="background: #eee; padding: 10px; width: 300px; font-weight: bold;"></pre>

    <script>
        document.getElementById('regForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const payload = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                mobileNumber: document.getElementById('mobile').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };
            
            fetch('/api/users/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                // തിരിച്ചു വരുന്ന യൂസർനെയിമും ഇമെയിലും ഭംഗിയായി കാണിക്കുന്നു
                document.getElementById('result').innerText = JSON.stringify(data, null, 2);
            });
        });
    </script>
</body>
</html>
