<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <title>Dashboard</title>
</head>
<body>
    <div style="padding: 20px; background-color: #f4f4f4; border: 1px solid #ccc; width: 50%;">
        <h1>Welcome Page</h1>
        <h3>Hello, <span th:text="${user.username}">User</span>!</h3>
        <p><b>Registered Phone:</b> <span th:text="${user.phoneNumber}">0000000000</span></p>
        <hr/>
        <a href="/logout" style="color: white; background-color: red; padding: 8px 15px; text-decoration: none; border-radius: 4px;">Logout</a>
    </div>
</body>
</html>
