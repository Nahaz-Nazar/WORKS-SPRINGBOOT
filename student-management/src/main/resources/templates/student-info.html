<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <title>Student Info</title>
</head>
<body>
    <h1>Student Details</h1>
    <p><b>Roll Number:</b> <span th:text="${student.rollNo}"></span></p>
    <p><b>Name:</b> <span th:text="${student.name}"></span></p>
    <p><b>Marks:</b> <span th:text="${student.marks}"></span></p>
</body>
</html>
