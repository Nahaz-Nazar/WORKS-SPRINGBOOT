<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <title>Student Data Modification Form</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f6f9; }
        .form-card { max-width: 400px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin: 0 auto; }
        .row-item { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .actions-tray { display: flex; gap: 10px; margin-top: 25px; }
        .save-btn { background-color: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 1rem; font-weight: bold; }
        .back-btn { background-color: #6c757d; color: white; text-decoration: none; padding: 10px 15px; border-radius: 4px; text-align: center; width: 100%; font-size: 1rem; }
    </style>
</head>
<body>

    <div class="form-card">
        <h2 th:text="${panelTitle}">Registration</h2>
        <form th:action="@{/student/save}" th:object="${student}" method="post">
            
            <!-- Crucial Hidden ID holder intercepts form data to distinguish between fresh insertions versus updates -->
            <input type="hidden" th:field="*{id}" />

            <div class="row-item">
                <label>Student Full Name:</label>
                <input type="text" th:field="*{name}" required autocomplete="off" />
            </div>
            
            <div class="row-item">
                <label>Assigned Class/Standard:</label>
                <input type="text" th:field="*{studentClass}" required autocomplete="off" />
            </div>
            
            <div class="row-item">
                <label>Age Metric:</label>
                <input type="number" th:field="*{age}" min="3" max="100" required />
            </div>

            <div class="actions-tray">
                <button type="submit" class="save-btn">Commit Changes</button>
                <a href="/students" class="back-btn">Cancel</a>
            </div>
        </form>
    </div>

</body>
</html>
