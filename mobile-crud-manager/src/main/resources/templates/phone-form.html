<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <title>Phone Data Input Form</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f6f9; }
        .card-view { max-width: 420px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin: 0 auto; }
        .element-row { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; }
        textarea { resize: vertical; height: 80px; }
        .buttons-tray { display: flex; gap: 10px; margin-top: 25px; }
        .submit-btn { background-color: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 1rem; font-weight: bold; }
        .cancel-btn { background-color: #6c757d; color: white; text-decoration: none; padding: 10px 15px; border-radius: 4px; text-align: center; width: 100%; font-size: 1rem; }
    </style>
</head>
<body>

    <div class="card-view">
        <h2 th:text="${panelTitle}">Catalog Registry Form</h2>
        <form th:action="@{/phone/save}" th:object="${phone}" method="post">
            
            <!-- Crucial Hidden ID tag lets JPA auto-differentiate new inserts from inline record updates -->
            <input type="hidden" th:field="*{id}" />

            <div class="element-row">
                <label>Phone Model Name:</label>
                <input type="text" th:field="*{name}" required autocomplete="off" />
            </div>
            
            <div class="element-row">
                <label>Detailed Specifications Description:</label>
                <textarea th:field="*{description}" required autocomplete="off"></textarea>
            </div>
            
            <div class="element-row">
                <label>Retail Price Tier (₹):</label>
                <input type="number" step="0.01" th:field="*{price}" required />
            </div>

            <div class="buttons-tray">
                <button type="submit" class="submit-btn">Save Phone Record</button>
                <a href="/phones" class="cancel-btn">Back to Stock</a>
            </div>
        </form>
    </div>

</body>
</html>
