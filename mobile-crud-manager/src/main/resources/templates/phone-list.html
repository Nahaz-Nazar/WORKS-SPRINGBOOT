<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <title>Mobile Store Management Panel</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f6f9; }
        .wrapper { max-width: 800px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin: 0 auto; }
        .bar-layout { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #007bff; color: white; }
        .add-btn { background-color: #28a745; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px; font-weight: bold; }
        .edit-link { color: #007bff; text-decoration: none; margin-right: 15px; font-weight: bold; }
        .delete-link { color: #dc3545; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="bar-layout">
            <h2>Mobile Inventory Management</h2>
            <a href="/phone/new" class="add-btn">➕ Add New Phone</a>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Stock ID</th>
                    <th>Model Identity</th>
                    <th>Description Summary</th>
                    <th>Base Pricing Specs</th>
                    <th>Control Operations</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="phone : ${phoneCollection}">
                    <td th:text="${phone.id}"></td>
                    <td th:text="${phone.name}" style="font-weight: bold; color: #2c3e50;"></td>
                    <td th:text="${phone.description}"></td>
                    <td th:text="'₹' + ${phone.price}"></td>
                    <td>
                        <a th:href="@{/phone/edit/{id}(id=${phone.id})}" class="edit-link">✏️ Edit Details</a>
                        <a th:href="@{/phone/delete/{id}(id=${phone.id})}" class="delete-link" 
                           onclick="return confirm('Are you sure you want to delete this phone record from inventory?');">🗑️ Delete</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(phoneCollection)}">
                    <td colspan="5" style="text-align: center; color: #777; padding: 25px;">No inventory catalog profiles are currently active in the database.</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
