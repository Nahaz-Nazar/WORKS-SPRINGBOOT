<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <title>New Product Entry</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f6f9; }
        .box { max-width: 400px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 1rem; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Add Shop Product</h2>
        <form th:action="@{/product/save}" th:object="${product}" method="post">
            <div class="group">
                <label>Product Name:</label>
                <input type="text" th:field="*{name}" required />
            </div>
            <div class="group">
                <label>Description:</label>
                <textarea th:field="*{description}" rows="3" required></textarea>
            </div>
            <div class="group">
                <label>Price (₹):</label>
                <input type="number" step="0.01" th:field="*{price}" required />
            </div>
            <button type="submit">Save Product</button>
        </form>
    </div>
</body>
</html>
