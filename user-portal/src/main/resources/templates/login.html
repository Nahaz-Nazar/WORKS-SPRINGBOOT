<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>
    <h2>Login Page</h2>
    <form action="/login" method="post">
        <div>
            <label>Email:</label>
            <input type="email" name="email" required />
        </div><br/>
        <div>
            <label>Password:</label>
            <input type="password" name="password" required />
        </div><br/>
        <button type="submit">Log In</button>
    </form>
</body>
</html>
