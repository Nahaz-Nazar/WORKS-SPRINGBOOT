<!DOCTYPE html>
<html>
<head>
    <title>Movie Website</title>
</head>
<body>

    <h1 th:text="${title}"></h1>

    <div th:if="${loggedIn}">
        <p th:text="${description}"></p>
    </div>

    <div th:unless="${loggedIn}">
        <p>Please log in to read the full movie description.</p>
    </div>

</body>
</html>
